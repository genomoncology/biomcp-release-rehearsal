{
  "feature": "article-fulltext",
  "live_check": "synthetic three-part PMC outline; no live source requests or clinical-positive claim",
  "story": "Explicit body parts retain one-based selection; range errors offer an exact typed call that retrieves the outline.",
  "replay": "article/fulltext/part-range",
  "config": {
    "mcp_tool_mode": "typed",
    "mcp_typed_output_schema": true
  },
  "steps": [
    {
      "mcp_call": {
        "name": "article_text",
        "arguments": {
          "input": "PMC5606870",
          "part": 1
        }
      },
      "expect": {
        "/status": "complete",
        "/result/content/data/part": 1,
        "/result/content/data/markdown": "## First section\n\nFirst body paragraph."
      }
    },
    {
      "mcp_call": {
        "name": "article_text",
        "arguments": {
          "input": "PMC5606870",
          "part": 2
        }
      },
      "expect": {
        "/status": "complete",
        "/result/content/data/part": 2,
        "/result/content/data/markdown": "## Second section\n\nSecond body paragraph."
      }
    },
    {
      "mcp_call": {
        "name": "article_text",
        "arguments": {
          "input": "PMC5606870",
          "part": 3
        }
      },
      "expect": {
        "/status": "complete",
        "/result/content/data/part": 3,
        "/result/content/data/markdown": "## Third section\n\nThird body paragraph."
      }
    },
    {
      "mcp_call": {
        "name": "article_text",
        "arguments": {
          "input": "PMC5606870",
          "part": 4
        }
      },
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--part",
        "/error/count": 3,
        "/error/valid_values": [
          "1..3"
        ],
        "/next": {
          "count": 1
        },
        "/next/0": {
          "equals": {
            "kind": "section",
            "name": "get_article",
            "arguments": {
              "input": [
                "PMC5606870"
              ],
              "section": [
                "fulltext"
              ]
            }
          }
        }
      }
    },
    {
      "follow": "section",
      "expect": {
        "/status": "complete",
        "/query/input": [
          "PMC5606870"
        ],
        "/query/section": [
          "fulltext"
        ],
        "/result/items/0/sections/fulltext/state": "data",
        "/result/items/0/sections/fulltext/data/parts": {
          "count": 3
        },
        "/result/items/0/sections/fulltext/data/parts/0/number": 1,
        "/result/items/0/sections/fulltext/data/parts/2/number": 3
      }
    }
  ]
}
