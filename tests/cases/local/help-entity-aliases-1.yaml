{
  "feature": "schema-discovery",
  "live_check": "local-only generated help and parser refusals; no source requests",
  "story": "Entity and command-topic aliases list their related executable commands and refuse unsupported arguments.",
  "steps": [
    {
      "run": [
        "help",
        "adverse-event"
      ],
      "mcp": [
        "help",
        "adverse-event"
      ],
      "expect": {
        "/schema": "biomcp.help/6",
        "/status": "complete",
        "/result/commands/*/command": {
          "includes_all_of": [
            [
              "search",
              "adverse-event"
            ],
            [
              "get",
              "adverse-event"
            ]
          ]
        }
      }
    },
    {
      "run": [
        "help",
        "adverse-event",
        "--unrecognized-argument"
      ],
      "exit": 2,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/code": "usage.arguments"
      }
    },
    {
      "run": [
        "help",
        "assay-count"
