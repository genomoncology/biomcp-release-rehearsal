{
  "feature": "query-validation",
  "live_check": "local-only validation; no source requests",
  "story": "Unclassified getter input failures retain command help rather than inventing a search.",
  "steps": [
    {
      "run": [
        "get",
        "trial",
        "lung cancer"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command",
        "/error/valid_values": [
          "Canonical ClinicalTrials.gov identifier."
        ],
        "/next/0/args": [
          "help",
          "get",
          "trial"
        ]
      }
    },
    {
      "run": [
        "get",
        "article",
        "lung cancer"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/next/0/args": [
          "help",
          "get",
          "article"
        ]
      }
    },
    {
      "run": [
        "get",
        "variant",
        "BRAF V600E"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/next/0/args": [
          "help",
          "get",
          "variant"
        ]
      }
    },
    {
      "run": [
        "get",
        "variant",
        "--",
        "--help"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "help",
          "get",
          "variant"
        ]
      }
    },
    {
      "run": [
        "get",
        "trial",
        "NCT02563002",
        "--offset",
        "1"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "help",
          "get",
          "trial"
        ]
      }
    },
    {
      "run": [
        "get",
        "author",
        "123"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "help",
          "get",
          "author"
        ]
      }
    },
    {
      "run": [
        "get",
        "article",
        "secret-input",
        "indexing"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "help",
          "get",
          "article"
        ]
      }
    },
    {
      "run": [
        "get",
        "trial",
        "NCT00000000"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/next/0/args": [
          "help",
          "get",
          "trial"
        ]
      }
    }
  ]
}
