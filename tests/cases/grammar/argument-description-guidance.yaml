{
  "feature": "query-validation",
  "live_check": "offline parser-only; no source requests",
  "story": "Nullable numeric failures retain source-owned accepted forms and bounds.",
  "steps": [
    {
      "run": [
        "get",
        "drug",
        "aspirin",
        "--civic-profile",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/valid_values/0": "integer >= 1 <= 2147483647"
      }
    },
    {
      "run": [
        "get",
        "drug",
        "aspirin",
        "--section-limit",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/valid_values/0": "integer >= 1 <= 50"
      }
    },
    {
      "run": [
        "get",
        "drug",
        "aspirin",
        "--section-offset",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/valid_values/0": "integer >= 0"
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--civic-profile",
        "old-value"
      ],
      "offline": true,
      "exit": 2,
      "expect": {
        "/status": "usage",
        "/error/code": "usage.arguments",
        "/error/valid_values/0": "integer >= 1 <= 2147483647"
      }
    }
  ]
}
