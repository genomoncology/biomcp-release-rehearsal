live_check: local-only case
feature: mcp-parity
story: The schema command and typed usage results agree through MCP and CLI
steps:
  - run: [schema, biomcp.source/1]
    mcp: [schema, biomcp.source/1]
    max_bytes: 4096
    expect:
      /$id: biomcp.source/1
  - run: []
    mcp: []
    is_error: false
    expect:
      /schema: biomcp.help/6
      /status: complete
  - mcp: [serve]
    is_error: true
    expect:
      /status: usage
