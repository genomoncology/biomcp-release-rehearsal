{
  "live_check": "public",
  "feature": "article-filters",
  "story": "Inclusive publication dates retain most recently added order across typed pages.",
  "replay": "article/filters/since",
  "steps": [
    {
      "run": [
        "search",
        "article",
        "KRAS G12C sotorasib",
        "--since",
        "2024",
        "--sort",
        "date",
        "--limit",
        "5"
      ],
      "max_bytes": 2970,
      "expect": {
        "/status": "complete",
        "/sources/0/term": "KRAS G12C sotorasib AND 2024:3000[dp]",
        "/page/returned": 5,
        "/query/sort": "date",
        "/result/items/*/pmid": {
          "equals": [
            "42891951",
            "42890422",
            "42870846",
            "42860233",
            "42814800"
          ]
        },
        "/result/items/*/header/date": {
          "equals": [
            "2026-10-17",
            "2026-10",
            "2026-09-30",
            "2026-10-11",
            "2026-09-30"
          ]
        }
      }
    },
    {
      "run": [
        "search",
        "article",
        "KRAS G12C sotorasib",
        "--since",
        "2024",
        "--sort",
        "date",
        "--limit",
        "5",
        "--offset",
        "5"
      ],
      "expect": {
        "/page/offset": 5,
        "/page/returned": 5,
        "/query/since": "2024",
        "/query/sort": "date"
      },
      "max_bytes": 3191
    }
  ]
}
