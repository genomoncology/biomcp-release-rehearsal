{
  "live_check": "local-only help discovery",
  "feature": "article-help",
  "story": "Article help exposes the shipped schemas and two executable examples per command",
  "steps": [
    {
      "run": [
        "help",
        "get",
        "article"
      ],
      "expect": {
        "/result/commands/0/command": [
          "get",
          "article"
        ],
        "/result/commands/0/examples": {
          "count": 1
        },
        "/result/commands/0/sections/*/word": {
          "includes_all_of": [
            "fulltext",
            "supplements",
            "annotations",
            "citations",
            "indexing",
            "tldr",
            "all"
          ]
        }
      },
      "max_bytes": 1885
    },
    {
      "run": [
        "help",
        "search",
        "article"
      ],
      "expect": {
        "/result/commands/0/command": [
          "search",
          "article"
        ],
        "/result/commands/0/examples": {
          "count": 1
        },
        "/result/commands/0/arguments/*/name": {
          "includes_all_of": [
            "--source",
            "--sort",
            "--open-access",
            "--no-preprints",
            "--exclude-retracted",
            "--include-retracted"
          ]
        },
        "/result/commands/0/arguments/15/name": "--source",
        "/result/commands/0/arguments/15/choices": [
          "pubmed",
          "europepmc",
          "litvar",
          "semantic-scholar",
          "litsense",
          "pubtator"
        ],
        "/result/commands/0/arguments/14/name": "--sort",
        "/result/commands/0/arguments/14/choices": [
          "rank",
          "date",
          "citations"
        ]
      },
      "max_bytes": 10160
    },
    {
      "run": [
        "help",
        "article",
        "text"
      ],
      "expect": {
        "/result/commands/0/command": [
          "article",
          "text"
        ],
        "/result/commands/0/examples": {
          "count": 1
        }
      },
      "max_bytes": 2414
    },
    {
      "run": [
        "help",
        "article",
        "supplement"
      ],
      "expect": {
        "/result/commands/0/command": [
          "article",
          "supplement"
        ],
        "/result/commands/0/examples": {
          "count": 1
        }
      },
      "max_bytes": 2690
    },
    {
      "run": [
        "help",
        "article",
        "citations"
      ],
      "expect": {
        "/result/commands/0/command": [
          "article",
          "citations"
        ],
        "/result/commands/0/examples": {
          "count": 1
        },
        "/result/commands/0/arguments/4/choices": [
          "icite",
          "semantic-scholar"
        ]
      },
      "max_bytes": 1977
    },
    {
      "run": [
        "help",
        "article",
        "references"
      ],
      "expect": {
        "/result/commands/0/command": [
          "article",
          "references"
        ],
        "/result/commands/0/examples": {
          "count": 1
        },
        "/result/commands/0/arguments/4/choices": [
          "icite",
          "semantic-scholar"
        ]
      },
      "max_bytes": 1991
    },
    {
      "run": [
        "help",
        "article",
        "citation-evidence"
      ],
      "expect": {
        "/result/commands/0/command": [
          "article",
