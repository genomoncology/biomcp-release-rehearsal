{
  "feature": "cell-line-identity",
  "live_check": "public",
  "story": "Species, NCIt disease, derived-line and sequence variation constraints are sent to Cellosaurus before its native window, so paging stays correct; human melanoma excludes mouse B16, a specific disease name and ID identify the same source line, excluding derived lines reaches the parent line in the first window, and variation replies show what matched and say the match is on source text.",
  "verified": "Unchanged public Cellosaurus API reply bodies captured 2026-11-04, CC BY 4.0; cite Bairoch (2018). Native ox (NCBI Taxonomy) and din (NCIt-only disease) fields documented at https://api.cellosaurus.org/api-fields. Variation and derived-line replies captured 2026-11-06 from the same API; var and hi are native fields. Disease name/ID comparison uses the complete one-row Desmoplastic melanoma result; no inferred disease mapping or local result filtering.",
  "replay": "cell-line/filters",
  "steps": [
    {
      "run": [
        "search",
        "cell-line",
        "--species",
        "Homo sapiens",
        "--disease",
        "Melanoma"
      ],
      "expect": {
        "/status": "complete",
        "/result/items/*/accession": {
          "equals": [
            "CVCL_B7MW",
            "CVCL_VU91",
            "CVCL_U803",
            "CVCL_M777",
            "CVCL_9U99"
          ]
        },
        "/result/items/*/species/items/*/id": {
          "equals": [
            "9606",
            "9606",
            "9606",
            "9606",
            "9606"
          ]
        },
        "/next/*/args/*": {
          "includes_all_of": [
            "--species",
            "Homo sapiens",
            "--disease",
            "Melanoma",
            "--offset"
          ]
        },
        "/result/items/*/name": {
          "excludes": "B16"
        }
      },
      "max_bytes": 9000
    },
    {
