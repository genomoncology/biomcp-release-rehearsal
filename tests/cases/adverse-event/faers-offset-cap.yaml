{
  "feature": "adverse-event-search",
  "live_check": "never",
  "story": "FAERS refuses offsets above its native 25000 cap before requesting the source.",
  "steps": [
    {
      "run": [
        "search",
        "adverse-event",
        "--source",
        "faers",
        "--drug",
        "aspirin",
        "--offset",
        "25001"
      ],
      "expect": {
        "/status": "usage",
        "/error/message": "FAERS supports --offset up to 25000; narrow the filters to retrieve more reports"
      },
      "exit": 2
    }
  ]
}
