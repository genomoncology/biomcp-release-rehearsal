{
  "feature": "adverse-event-search",
  "live_check": "exclude: local argument refusal only; no source request or clinical claim",
  "story": "An explicit drug value cannot silently treat several OR-joined names as one literal name.",
  "steps": [
    {
      "run": [
        "search",
        "adverse-event",
        "--drug",
        "imatinib OR nilotinib"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/status": "usage",
        "/error/option": "--drug",
        "/error/message": "pass --drug once per literal name to search several names with OR; OR inside one --drug value is not supported"
      }
    },
    {
      "run": [
        "search",
        "adverse-event",
        "--drug",
        "synthetic A   OR   synthetic B"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/status": "usage",
        "/error/option": "--drug",
        "/error/message": "pass --drug once per literal name to search several names with OR; OR inside one --drug value is not supported"
      }
    },
    {
      "run": [
        "search",
        "adverse-event",
        "--drug",
        "synthetic A or synthetic B"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/status": "usage",
        "/error/option": "--drug",
        "/error/message": "pass --drug once per literal name to search several names with OR; OR inside one --drug value is not supported"
      }
    },
    {
      "run": [
        "--disable-sources",
        "faers",
        "search",
        "adverse-event",
        "--drug",
        "oral",
        "--drug",
        "atorvastatin"
      ],
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/query/drug": [
          "oral",
          "atorvastatin"
        ],
        "/sources/0/source": "faers",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "disabled"
      }
    }
  ]
}
