live_check: "public"
verified: "The unchanged native Reactome card is retained in pathway/native and reused by the ordinary pathway cases. Nightly execution checks its JSON step; the Markdown rendering step is local presentation over the same source reply."
feature: markdown-view
story: Markdown preserves the reviewed pathway title and next commands within its original output ceiling.
replay: pathway/native
steps:
  - run: [get, pathway, R-HSA-5673001, --format, json]
    expect:
      /status: complete
      /result/pathway/id: {equals: {namespace: reactome, id: R-HSA-5673001}}
  - run: [get, pathway, R-HSA-5673001, --format, md]
    max_bytes: 710
    expect:
      '':
        includes_all_of:
          - RAF/MAP kinase cascade
          - biomcp get pathway R-HSA-5673001 summary
          - biomcp get pathway R-HSA-5673001 genes
          - biomcp get pathway R-HSA-5673001 events
