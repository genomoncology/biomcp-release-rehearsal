        "/result/items/0/sections/constraint/state": "not-applicable",
        "/sources/*/source": {
          "includes": "mygene",
          "excludes": "uniprot"
        },
        "/result/items/0/sections/protein/state": "not-applicable"
      },
      "max_bytes": 3100
    }
  ]
}
