{
  "live_check": "public",
  "feature": "gene-protein",
  "story": "MIR21 rules out protein and constraint without either source",
  "replay": "gene/constraint",
  "steps": [
    {
      "run": [
        "get",
        "gene",
        "MIR21",
        "constraint",
        "protein"
      ],
      "expect": {
