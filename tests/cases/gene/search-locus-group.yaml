{
  "live_check": "public",
  "feature": "gene-search",
  "story": "Locus groups intersect before ranking and paging",
  "replay": "gene/main",
  "steps": [
    {
      "run": [
        "search",
        "gene",
        "--band",
        "9p21.3",
        "--locus-group",
        "pseudogene",
        "--limit",
        "2",
        "--offset",
        "24"
      ],
      "expect": {
        "/page/total": 25,
        "/page/returned": 1,
        "/result/items/*/locus_group": [
          "pseudogene"
        ]
      }
    },
    {
      "run": [
        "search",
        "gene",
        "--locus-group",
        "protein_coding"
      ],
      "expect": {
        "/error/code": "usage.arguments"
      },
      "exit": 2,
      "is_error": true
    }
  ]
}
