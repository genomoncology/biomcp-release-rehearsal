{
  "feature": "variant-identity",
  "live_check": "synthetic response-only routing matrix over existing public IDs",
  "replay": "variant/id-forms",
  "story": "hgvs input reaches each identity-taking variant command or names accepted forms and its converting command.",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "NM_004333.4:c.1799T>A"
      ],
      "expect": {
        "/result/resolution": "resolved"
      }
    },
    {
      "run": [
        "variant",
        "assertions",
        "NM_004333.4:c.1799T>A",
        "--source",
        "clinvar"
      ],
      "expect": {
        "/result/assertions/0/domain": "germline"
      }
    },
    {
      "run": [
        "variant",
        "population",
        "NM_004333.4:c.1799T>A"
      ],
      "expect": {
        "/result/population/state": "data",
        "/result/population/data/build": "GRCh38"
      }
    },
    {
      "run": [
        "variant",
        "recurrence",
        "NM_004333.4:c.1799T>A",
        "--source",
        "cbioportal",
        "--gene",
        "BRAF",
        "--study",
        "msk_impact_2017",
        "--profile",
        "msk_impact_2017_mutations",
        "--sample-set",
        "msk_impact_2017_all",
        "--limit",
        "3"
      ],
      "expect": {
        "/result/examined_rows": 3
      }
    },
    {
      "run": [
        "variant",
        "normalize",
        "--source",
        "mutalyzer",
        "--hgvs",
        "NM_004333.4:c.1799T>A"
      ],
      "expect": {
        "/result/results/0/outcome": "resolved"
      }
    },
    {
      "run": [
        "variant",
        "assertions",
        "NM_004333.4:c.1799T>A",
        "--source",
        "erepo"
      ],
      "expect": {
        "/status": "absent"
      },
      "exit": 1
    },
    {
      "run": [
        "search",
        "variant",
        "--query",
        "NM_004333.4:c.1799T>A",
        "--source",
        "myvariant"
      ],
      "expect": {
        "/result/source_query": "NM_004333.4:c.1799T>A",
        "/page/total": 0
      }
    },
    {
      "run": [
        "get",
        "variant",
        "NM_004333.4:c.1799T>A",
        "all"
      ],
      "expect": {
        "/result/resolution": "resolved",
        "/result/candidates/0/sections/clinvar/state": "data",
        "/result/candidates/0/sections/erepo/state": "empty",
        "/result/candidates/0/sections/population/state": "data",
        "/result/candidates/0/sections/gwas/state": "empty",
        "/result/candidates/0/sections/civic/state": "data",
        "/result/candidates/0/sections/hotspots/reason": "no-join-id",
        "/result/candidates/0/sections/oncokb/reason": "no-key",
        "/result/candidates/0/sections/alphagenome/reason": "no-key",
        "/result/candidates/0/sections/predict/state": "empty",
        "/result/candidates/0/sections/conservation/state": "empty",
        "/result/candidates/0/sections/cosmic/state": "empty"
      }
    },
    {
      "run": [
        "variant",
        "normalize",
        "--source",
        "mutalyzer",
        "--hgvs",
        "c.1799T>A"
      ],
      "exit": 2,
      "expect": {
        "/error/message": "normalization needs reference-qualified HGVS; for gene shorthand use search variant --gene <SYMBOL> --coding <CHANGE> or --protein <CHANGE>, then get variant <ID>"
      }
    },
    {
      "run": [
        "variant",
        "normalize",
        "--source",
        "mutalyzer",
        "--hgvs",
        "NM_004333.4:c."
      ],
      "exit": 2,
      "expect": {
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command"
      }
    }
  ]
}
