{
  "feature": "variant-identity",
  "live_check": "local-only unsupported input validation; no source requests",
  "story": "Unsupported multi-base coordinate REF or ALT is refused before source access and names single-base coordinates or reference-qualified HGVS with source normalization.",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "7-140753336-AA-T"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/error/valid_values": {
          "count": 1
        },
        "": {
          "omits": [
            "sources",
            "result"
          ]
        }
      }
    },
    {
      "run": [
        "--format",
        "md",
        "get",
        "variant",
        "7-140753336-AA-T"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "": {
          "includes_all_of": [
            "single-base",
            "reference-qualified HGVS",
            "variant normalize --source car --hgvs"
          ]
        }
      }
    },
    {
      "run": [
        "get",
        "variant",
        "7-140753336-AC-T"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/error/valid_values": {
          "count": 1
        },
        "": {
          "omits": [
            "sources",
            "result"
          ]
        }
      }
    },
    {
      "run": [
        "get",
        "variant",
        "7-140753336-A-TT"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "input",
        "/error/valid_values": {
          "count": 1
        },
        "": {
          "omits": [
            "sources",
            "result"
          ]
        }
      }
    }
  ]
}
