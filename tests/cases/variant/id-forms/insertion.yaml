{
  "feature": "variant-identity",
  "replay": "variant/id-forms",
  "live_check": "recorded identity matrix with synthetic unrelated-source routing; exclude from live calls",
  "story": "insertion VCF coordinates retain their complete reference for CAR validation and reach each variant command or its named-forms refusal.",
  "steps": [
    {
      "run": [
        "--disable-sources",
        "myvariant",
        "get",
        "variant",
        "17-43057065-G-GG"
      ],
      "expect": {
        "/result/resolution": "resolved",
        "/result/candidates/0/identity/ids/0": "CA003404"
      }
    },
    {
      "run": [
        "variant",
        "population",
        "17-43057065-G-GG"
      ],
      "expect": {
        "/status": "complete",
        "/result/population/state": "data",
        "/result/population/data/variant": "17-43057062-T-TG",
        "/result/population/data/build": "GRCh38"
      },
      "mcp": [
        "variant",
        "population",
        "17-43057065-G-GG"
      ]
    },
    {
      "run": [
        "variant",
        "recurrence",
        "17-43057065-G-GG",
        "--source",
        "cbioportal",
        "--gene",
        "BRAF",
        "--study",
        "msk_impact_2017",
        "--profile",
        "msk_impact_2017_mutations",
        "--sample-set",
        "msk_impact_2017_all",
        "--limit",
        "3"
      ],
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/problems/*/field": {
          "includes_all_of": [
            "input: requires one exact source-qualified allele (CAid or reference-qualified genomic HGVS) with the source's required annotations; convert with get variant <ID> and select an exact candidate"
          ]
        }
      }
    },
    {
      "run": [
        "variant",
        "normalize",
        "--source",
        "mutalyzer",
        "--hgvs",
        "17-43057065-G-GG"
      ],
      "exit": 2,
      "expect": {
        "/error/message": "normalization accepts reference-qualified HGVS, or chromosome genomic HGVS with CAR and --build; convert rsIDs, clinvar:N, VCV accessions and genomic coordinates with get variant <ID> first"
      }
    },
    {
      "run": [
        "variant",
        "assertions",
        "17-43057065-G-GG",
        "--source",
        "erepo"
      ],
      "expect": {
        "/status": "absent"
      },
      "exit": 1
    },
    {
      "run": [
        "search",
        "variant",
        "--query",
        "17-43057065-G-GG",
        "--source",
        "myvariant"
      ],
      "expect": {
        "/result/source_query": "17-43057065-G-GG",
        "/page/total": 0
      }
    }
  ]
}
