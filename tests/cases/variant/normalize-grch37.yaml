{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "replay": "variant/normalization/grch37",
  "story": "An explicit chromosome build reaches the registry without changing its coordinates.",
  "steps": [
    {
      "run": [
        "variant",
        "normalize",
        "--source",
        "car",
        "--hgvs",
        "chr10:g.114758349C>T",
        "--build",
        "GRCh36"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/option": "--build",
        "/error/valid_values": [
          "GRCh37",
          "GRCh38"
        ]
      }
    }
  ]
}
