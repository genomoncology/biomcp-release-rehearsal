{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "replay": "variant/recurrence",
  "story": "A captured explicit cohort query reports only exact allele sample observations and preserves a literal source notice",
  "steps": [
    {
      "run": [
        "variant",
        "recurrence",
        "NC_000007.13:g.140494253G>A",
        "--source",
        "cbioportal",
        "--gene",
        "BRAF",
