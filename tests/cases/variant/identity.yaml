{
  "feature": "variant-identity",
  "live_check": "synthetic",
  "story": "Published variant identifiers retain identity and source policy before lookup",
  "steps": [
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--limit",
        "0"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command",
        "/error/option": "--limit",
        "/next/0/args": [
          "help",
          "get",
          "variant"
        ]
      }
    },
    {
      "run": [
        "get",
        "variant",
        "rs113488022",
        "--offset",
        "-1"
      ],
      "exit": 2,
      "is_error": true,
      "expect": {
        "/schema": "biomcp.error/4",
        "/error/message": "option is missing or invalid; choose an accepted value or form and use the suggested help command",
        "/error/option": "--offset",
        "/next/0/args": [
          "help",
          "get",
          "variant"
        ]
      }
    }
  ]
}
