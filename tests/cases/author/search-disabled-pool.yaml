{
  "feature": "author-search",
  "story": "Disabled Semantic Scholar refuses warm search snapshots and explicit continuations",
  "live_check": "synthetic control",
  "replay": "author/synthetic",
  "steps": [
    {
      "run": [
        "search",
        "author",
        "Louis Williams"
      ],
      "expect": {
        "/status": "complete"
      },
      "max_bytes": 1191,
      "full_output_bytes": true
    },
    {
      "run": [
        "search",
        "author",
        "Louis Williams",
        "--disable-sources",
        "noncommercial",
        "--offset",
        "5",
        "--pool",
        "<pool>"
      ],
      "is_error": true,
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/source": "semantic-scholar",
        "/sources/0/state": "skipped",
        "/sources/0/reason": "disabled"
      },
      "full_output_bytes": true,
      "max_bytes": 442
    }
  ]
}
