      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/source": "openfda-label",
        "/sources/0/state": "failed",
        "/sources/0/reason": "bad-reply"
      }
    },
    {
      "run": [
        "search",
        "drug",
        "CAVHANZA",
        "--source",
        "openfda-label",
        "--limit",
        "1"
      ],
      "offline": true,
      "exit": 4,
      "expect": {
        "/status": "failed",
        "/sources/0/reason": "offline"
      }
    }
  ]
}
