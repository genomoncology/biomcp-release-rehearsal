{
  "feature": "trial-search",
  "live_check": "synthetic",
  "story": "Invalid and retired trial inputs explain their replacement before any provider call.",
  "steps": [
    {
      "run": [
        "search",
        "trial",
        "--condition",
        "melanoma",
        "--updated-since",
        "2026-01-01",
        "--updated-until",
        "2025-01-01"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/status": "usage"
      }
    },
    {
      "run": [
        "--format",
        "json",
        "search",
        "trial",
        "--count-only",
        "--mutation",
        "old-value"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/error/message": "retired; use: --variant for explicit discovery text"
      }
    },
    {
      "run": [
        "search",
        "trial",
        "--config",
        "unused-retired-command-config",
        "--has-results",
        "--offset",
        "old-value"
      ],
      "exit": 2,
      "offline": true,
      "expect": {
        "/error/code": "usage.arguments",
        "/error/valid_values/0": "Zero-based offset of the first row in this continuation page. Minimum: 0."
      }
    }
  ],
  "verified": "The final five explicit migration replies were measured in j10693 at 160, 172, 160, 151 and 173 compact CLI bytes. Each ceiling is ceil(actual*1.15). These fixed guidance envelopes have no comparable released 0.9 migration-response baseline."
}
