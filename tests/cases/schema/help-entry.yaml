{
  "live_check": "local-only case",
  "feature": "schema-discovery",
  "story": "Help entry points show the public grammar before any source access.",
  "steps": [
    {
      "run": [
        "help",
        "schema"
      ],
      "expect": {
        "/result/commands/0/command": [
          "schema"
        ],
        "/result/commands/0/description": "List every schema identity and description with biomcp schema, or print one schema artifact with biomcp schema <id>.",
        "/result/commands/0/examples": [
          [
            "schema"
          ],
          [
            "schema",
            "biomcp.help/6"
          ]
        ]
      }
    },
    {
      "run": [
        "skill",
        "install",
        "--help"
      ],
      "expect": {
        "/result/commands/0/command": [
          "skill",
          "install"
        ]
      }
    },
    {
      "run": [
        "serve",
        "--http",
        "--help"
      ],
      "expect": {
        "/result/commands/0/command": [
          "serve"
        ]
      }
    }
  ]
}
