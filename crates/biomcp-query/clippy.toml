# Shared settings come from clippy-base.toml; the ratchet refuses drift.
too-many-lines-threshold = 80
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-types = [
    { path = "biomcp_fetch::Arg", reason = "Adapters own provider request syntax" },
    { path = "biomcp_fetch::Endpoint", reason = "Adapters own provider endpoints" },
    { path = "biomcp_fetch::Input", reason = "Adapters own provider request inputs", allow-invalid = true },
    { path = "std::cell::Cell", reason = "Interior state needs an item-level reason" },
    { path = "std::cell::RefCell", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::Mutex", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::RwLock", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::OnceLock", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::LazyLock", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicBool", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI8", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI16", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI32", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI64", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicIsize", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU8", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU16", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU32", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU64", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicUsize", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicPtr", reason = "Interior state needs an item-level reason" },
    { path = "std::fs::File", reason = "Keep values immutable and free of I/O" },
    { path = "std::fs::OpenOptions", reason = "Keep values immutable and free of I/O" },
    { path = "std::net::TcpStream", reason = "Keep values immutable and free of I/O" },
    { path = "std::net::TcpListener", reason = "Keep values immutable and free of I/O" },
    { path = "std::net::UdpSocket", reason = "Keep values immutable and free of I/O" },
    { path = "std::process::Command", reason = "Keep values immutable and free of I/O" },
    { path = "std::time::Instant", reason = "Keep values immutable and free of I/O" },
    { path = "std::time::SystemTime", reason = "Keep values immutable and free of I/O" },
]

disallowed-macros = [
    { path = "serde_json::json", reason = "Construct follow-ups through checked typed queries" },
]

disallowed-methods = [
    { path = "serde_json::from_value", reason = "Construct follow-ups through checked typed queries" },
    { path = "std::env::set_current_dir", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::process::exit", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::process::abort", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::process::id", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::fs::DirBuilder::new", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::fs::DirBuilder::create", reason = "Keep I/O and state at their reviewed boundaries" },
