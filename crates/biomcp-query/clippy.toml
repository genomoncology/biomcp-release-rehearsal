    { path = "std::fs::remove_file", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::fs::remove_dir", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::fs::remove_dir_all", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::fs::create_dir", reason = "Keep I/O and state at their reviewed boundaries" },
    { path = "std::fs::create_dir_all", reason = "Keep I/O and state at their reviewed boundaries" },
