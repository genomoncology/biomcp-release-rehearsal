[package]
name = "biomcp-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prost.workspace = true
tonic = { workspace = true, features = ["codegen"] }
h2 = { workspace = true }
hyper = { version = "1", default-features = false, features = ["http2"] }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
base64.workspace = true
zstd = { version = "=0.14.3", default-features = false }
csv.workspace = true
flate2.workspace = true
biomcp-types = { workspace = true }
url.workspace = true
idna_adapter.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
ureq.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
sha2.workspace = true
httpdate.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true

tempfile.workspace = true

[dev-dependencies]
biomcp-test-support.workspace = true
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# This exact direct constraint selects url's ASCII-only IDNA backend.
ignored = ["idna_adapter"]
