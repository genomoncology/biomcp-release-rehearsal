jsonschema.workspace = true
libtest-mimic.workspace = true
serde-saphyr.workspace = true
toml.workspace = true

[lints]
workspace = true

[[test]]
name = "cases"
harness = false

[[test]]
name = "tools"
test = false
harness = false

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process", "fs", "poll"] }
