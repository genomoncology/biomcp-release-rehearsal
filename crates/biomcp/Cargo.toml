[package]
name = "biomcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shlex.workspace = true
biomcp-types = { workspace = true, features = ["schema"] }
sha2.workspace = true
rpassword = "=7.5.4"
tempfile.workspace = true
base64.workspace = true
httparse.workspace = true
ctrlc.workspace = true
clap = { workspace = true, features = ["error-context", "usage"] }
serde.workspace = true
biomcp-fetch = { workspace = true }
biomcp-query = { workspace = true }
serde_json.workspace = true
quick-xml = { workspace = true, features = ["escape-html"] }
biodata = { workspace = true, features = ["schema"] }

[build-dependencies]
biomcp-types = { workspace = true }
serde-saphyr.workspace = true
serde_json.workspace = true

[dev-dependencies]
same-file = "=1.0.6"
biomcp-test-support.workspace = true
biomcp-adapters.workspace = true
url.workspace = true
rusqlite.workspace = true
rustls.workspace = true
jsonschema.workspace = true
libtest-mimic.workspace = true
serde-saphyr.workspace = true
toml.workspace = true

[lints]
workspace = true

[[test]]
name = "cases"
harness = false

[[test]]
name = "tools"
test = false
harness = false

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process", "fs", "poll"] }
