[package]
name = "biomcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
shlex.workspace = true
biomcp-types = { workspace = true, features = ["schema"] }
sha2.workspace = true
rpassword = "=7.5.4"
tempfile.workspace = true
base64.workspace = true
httparse.workspace = true
ctrlc.workspace = true
clap = { workspace = true, features = ["error-context", "usage"] }
serde.workspace = true
biomcp-fetch = { workspace = true }
biomcp-query = { workspace = true }
serde_json.workspace = true
biodata = { workspace = true, features = ["schema"] }

[build-dependencies]
serde-saphyr.workspace = true
serde_json.workspace = true

[dev-dependencies]
biomcp-adapters.workspace = true
url.workspace = true
h2 = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tonic = { workspace = true, features = ["codegen"] }
prost = { workspace = true }
rusqlite.workspace = true
rcgen = { workspace = true, features = ["pem", "ring"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
