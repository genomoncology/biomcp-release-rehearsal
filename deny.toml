[advisories]
version = 2

[licenses]
allow = ["MIT", "Apache-2.0"]

# Serde derives use Unicode identifier tables under this additional license.
[[licenses.exceptions]]
name = "unicode-ident"
version = "=1.0.27"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

# Approved TLS dependencies retain their upstream permissive licenses.
[[licenses.exceptions]]
name = "ring"
version = "=0.17.14"
allow = ["Apache-2.0", "ISC"]

[[licenses.exceptions]]
name = "rustls-webpki"
version = "=0.103.16"
allow = ["ISC"]

[[licenses.exceptions]]
name = "untrusted"
version = "=0.9.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "subtle"
version = "=2.6.1"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.11"
allow = ["CDLA-Permissive-2.0"]

# The approved build-time YAML parser reads encoded input through encoding_rs.
# Its WHATWG tables retain the upstream BSD notice alongside MIT/Apache code.
[[licenses.exceptions]]
name = "encoding_rs"
version = "=0.8.42"
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]

# The approved ZIP deflate reader selects the pure Rust zlib backend.
[[licenses.exceptions]]
name = "zlib-rs"
version = "=0.6.8"
allow = ["Zlib"]

# Approved bounded tensor decompression retains the upstream BSD terms.
[[licenses.exceptions]]
name = "zstd"
version = "=0.14.3"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-safe"
version = "=8.2.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-sys"
version = "=2.1.2+zstd.1.5.7"
allow = ["BSD-3-Clause"]

# Native bounded FDA PDF reader dependencies retain their permissive upstream licenses.
# https://crates.io/crates/alloc-no-stdlib/2.0.4 and alloc-stdlib/0.2.4
[[licenses.exceptions]]
name = "alloc-no-stdlib"
version = "=2.0.4"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "alloc-stdlib"
version = "=0.2.4"
allow = ["BSD-3-Clause"]

# https://crates.io/crates/unicode-normalization/0.1.26 and unicode-properties/0.1.5
[[licenses.exceptions]]
name = "unicode-normalization"
version = "=0.1.26"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[[licenses.exceptions]]
name = "unicode-properties"
version = "=0.1.5"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
# The dependency ratchet also checks these revisions; cargo-deny compares repository paths.
allow-git = ["https://github.com/genomoncology/biodata?rev=8bcd2456cab32d04daaac5ea0a17ea4151d4224e"]
