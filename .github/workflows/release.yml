name: Release

# Dispatch rehearses the checked-out revision without publication.
# A tag qualifies the same artifacts and then waits for the release operator.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      approval_rehearsal:
        description: Exercise publication approvals without publishing or authenticating to channels
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      matrix: ${{ steps.identity.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read release tool pins
        id: tools
        shell: bash
        env:
          BOOTSTRAP_PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: '"$BOOTSTRAP_PYTHON" release/toolchain.py outputs >> "$GITHUB_OUTPUT"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          python release/toolchain.py python-check
          python release/toolchain.py install-rust
      - name: Check release tool pins
        run: python3 release/toolchain.py check
      - name: Bind the candidate version, source and native platform matrix
        id: identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 release/workflow.py identity --event "$GITHUB_EVENT_NAME" \
            --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Screen candidate dependencies against current advisories and source policy
        run: |
          cargo install cargo-deny --version "${{ steps.tools.outputs.cargo_deny }}" --locked
          make audit
      - name: Scan the complete candidate history for secrets
        run: make secrets-full
      - name: Require protected operator approval for a production release
        if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/release-publication" > "$RUNNER_TEMP/protection.json"
          python3 release/workflow.py protection "$RUNNER_TEMP/protection.json"

  qualify:
    needs: candidate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read release tool pins
        id: tools
        shell: bash
        env:
          BOOTSTRAP_PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: '"$BOOTSTRAP_PYTHON" release/toolchain.py outputs >> "$GITHUB_OUTPUT"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - name: Install the pinned Rust toolchain
        if: runner.os != 'Linux' || matrix.platform == 'manylinux_2_28_x86_64'
        shell: bash
        run: |
          python release/toolchain.py python-check
          python release/toolchain.py install-rust
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: github.ref_type != 'tag'
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
            .release-cache
          key: release-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'release/toolchain.json') }}
      - name: Check formatting, lint and tests on Linux x86_64
        if: matrix.platform == 'manylinux_2_28_x86_64'
        run: make fmt lint test docs-check
      - name: Build and install native artifacts, including CLI version and offline health
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python release/artifacts.py build --revision "$GITHUB_SHA" --output dist
          python release/gate.py --artifacts dist --scratch "$RUNNER_TEMP/install" --python python
          cp "$RUNNER_TEMP/install/report.json" dist/install-report.json
          if [ "$RUNNER_OS" = macOS ]; then
            python -c 'import json; assert any(r["artifact"] == "homebrew-formula" and r["result"] == "pass" for r in json.load(open("dist/install-report.json")))'
          fi
      - name: Build and install Linux artifacts with CLI checks at the manylinux floor
        if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: make release-linux
      - name: Compare the candidate schemas with the released baseline
        if: matrix.platform == 'manylinux_2_28_x86_64'
        run: make schema-release-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}
          path: dist
          if-no-files-found: error

  stage:
    needs: [candidate, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: artifacts
      - name: Prepare every channel's publication payload without uploading it
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          python3 release/workflow.py stage --artifacts artifacts --plugin . \
            --version "$VERSION" --revision "$GITHUB_SHA" --output staged
          ruby -c staged/biomcp.rb
      - name: Scan every staged publication artifact for secrets
        run: python3 release/secrets.py artifacts staged
      - name: Enumerate every staged artifact for attestation
        run: python3 release/workflow.py subjects --artifacts staged --output "$RUNNER_TEMP/subjects.sha256"
      # https://github.com/actions/attest/tree/v4.2.2
      # No registry push or storage record needs additional write permissions.
      - name: Attest every staged artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
          create-storage-record: false
          push-to-registry: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: staged
          if-no-files-found: error
      - name: State the rehearsal boundary
        run: |
          {
            echo 'All five native install gates, both Linux container gates and publication payload checks passed.'
            echo 'No channel was published. Authentication, uploads, directory acceptance, site delivery and latest pointer movement remain unexercised.'
            echo 'Every staged file has signed build provenance. Verify downloaded files against this repository, workflow and source commit.'
          } >> "$GITHUB_STEP_SUMMARY"

  staged-homebrew:
    needs: [candidate, stage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macosx_11_0_x86_64
          - os: macos-14
            platform: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read release tool pins
        id: tools
        run: python3 release/toolchain.py outputs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.tools.outputs.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-${{ matrix.platform }}
          path: native
      - name: Install the staged two-architecture Homebrew formula
        run: python release/gate.py --artifacts native --scratch "$RUNNER_TEMP/formula" --staged-formula staged/biomcp.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-homebrew-${{ matrix.platform }}
          path: ${{ runner.temp }}/formula/report.json
          if-no-files-found: error

  publish-github:
    needs: [candidate, stage, staged-homebrew]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Publish checked archives, desktop bundles and plugin assets
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 release/publication.py github --staged staged
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Approval reached; no channel authentication or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

  publish-ghcr:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    needs: [candidate, stage, staged-homebrew]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push both checked images and their manifest
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        id: image
        run: python3 release/publication.py ghcr --staged staged >> "$GITHUB_OUTPUT"
      - name: Attest the pushed container digest in GHCR
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/genomoncology/biomcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Approval reached; no channel authentication or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

  publish-pypi:
    needs: [candidate, stage, staged-homebrew, publish-ghcr]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Select wheels for the Trusted Publisher
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        run: python3 release/publication.py wheels --staged staged
      # https://docs.pypi.org/trusted-publishers/using-a-publisher/
      - name: Publish wheels with Trusted Publishing and attestations
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: pypi/
          attestations: true
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Approval reached; no channel authentication or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

  publish-homebrew:
    needs: [candidate, stage, staged-homebrew, publish-github]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Check out the public Homebrew tap
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: genomoncology/homebrew-biomcp
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Publish the staged two-architecture formula
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        run: python3 release/publication.py homebrew --staged staged --checkout tap
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Approval reached; no channel authentication or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

  publish-installer:
    needs: [candidate, stage, staged-homebrew, publish-github]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Check out the existing Pages publication
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: site
      - name: Publish the staged installer to the public site
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 release/publication.py installer --staged staged --checkout site
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Approval reached; no channel authentication or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

  publish-registry:
    needs: [candidate, stage, staged-homebrew, publish-pypi]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Read publisher tool pins
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        id: tools
        run: python3 release/toolchain.py outputs >> "$GITHUB_OUTPUT"
      - name: Install the pinned Sigstore verifier
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ steps.tools.outputs.cosign }}
      - name: Install the pinned MCP Registry publisher
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        run: python3 release/toolchain.py install-mcp-publisher
      # https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
      - name: Publish the staged MCP Registry record using GitHub OIDC
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        run: python3 release/publication.py registry --staged staged
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Approval reached; no channel authentication or publication attempted.' >> "$GITHUB_STEP_SUMMARY"

  post-publish:
    needs: [candidate, publish-github, publish-ghcr, publish-pypi, publish-homebrew, publish-installer, publish-registry]
    if: (github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: pypi
            os: ubuntu-24.04
          - channel: ghcr
            os: ubuntu-24.04
          - channel: homebrew
            os: macos-14
          - channel: installer
            os: ubuntu-24.04
          - channel: registry
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install from the published channel and check the candidate version
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ needs.candidate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 release/published.py "$CHANNEL" --version "$VERSION"
      - name: Report the install rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Dispatch skips public channel installs; the promotion approval follows these no-op jobs.' >> "$GITHUB_STEP_SUMMARY"

  publish-latest:
    needs: [candidate, stage, publish-ghcr, post-publish]
    if: success() && ((github.event_name == 'push' && github.repository == 'genomoncology/biomcp') || inputs.approval_rehearsal)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publication
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: staged
      - name: Log in to GHCR for promotion
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only the newest checked stable release
        if: github.event_name == 'push' && github.repository == 'genomoncology/biomcp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish-ghcr.outputs.digest }}
        run: python3 release/publication.py promote --staged staged --digest "$DIGEST"
      - name: Report the approval rehearsal boundary
        if: inputs.approval_rehearsal
        run: echo 'Promotion approval reached; latest pointers stay unchanged.' >> "$GITHUB_STEP_SUMMARY"
