too-many-lines-threshold = 80
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-types = [
    { path = "std::cell::Cell", reason = "Interior state needs an item-level reason" },
    { path = "std::cell::RefCell", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::Mutex", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::RwLock", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::OnceLock", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::LazyLock", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicBool", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI8", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI16", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI32", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicI64", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicIsize", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU8", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU16", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU32", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicU64", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicUsize", reason = "Interior state needs an item-level reason" },
    { path = "std::sync::atomic::AtomicPtr", reason = "Interior state needs an item-level reason" },
]
